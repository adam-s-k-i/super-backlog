name: Release

on:
  push:
    branches: [master]

permissions: {}

jobs:
  Release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created || steps.check.outputs.releases_created }}
    steps:
      - id: rp
        uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        if: always() && steps.rp.conclusion == 'success'
      - id: check
        if: always() && steps.rp.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "releases_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "releases_created=false" >> "$GITHUB_OUTPUT"
          fi

  Publish:
    needs: Release-please
    if: needs.Release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
