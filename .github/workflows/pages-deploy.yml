name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refreshed dashboard screenshot branch
      pull-requests: write # open the screenshot refresh PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/generate-dashboard.mjs
      - run: node scripts/capture-dashboard.mjs
      - name: Open PR when the README screenshot changed
        if: github.event_name == 'push'
        env:
          # A PAT (not GITHUB_TOKEN): workflow runs on branches pushed with
          # GITHUB_TOKEN land in "action required" and never auto-merge.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          if git diff --quiet docs/assets/dashboard.png; then
            echo "screenshot unchanged"
            exit 0
          fi
          git config user.name "adam-s-k-i"
          git config user.email "adam.henne@gmail.com"
          git checkout -B docs/dashboard-screenshot
          git add docs/assets/dashboard.png
          # No [skip ci]: the PR's required checks must actually run so that
          # auto-merge can fire without any human review.
          git commit -m "docs: refresh dashboard screenshot"
          git push -f "https://x-access-token:${{ secrets.AUTO_MERGE_TOKEN }}@github.com/adam-s-k-i/super-backlog.git" docs/dashboard-screenshot
          gh pr create --title "docs: refresh dashboard screenshot" \
            --body "Regenerated docs/assets/dashboard.png from the curated demo dataset (scripts/capture-dashboard.mjs)." \
            --base master --head docs/dashboard-screenshot || echo "PR already exists"
          gh pr merge --auto --merge || echo "auto-merge already enabled"
      - run: npx vitepress build docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
