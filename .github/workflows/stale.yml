name: Stale

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  Mark-and-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-stale: 30
          days-before-close: 14
          exempt-issue-labels: bug,pinned,security
          exempt-pr-labels: pinned,security
          stale-label: stale
          stale-issue-message: "This has been inactive for 30 days and will be closed in 14 days."
          stale-pr-message: "This PR has been inactive for 30 days and will be closed in 14 days."

  Bug-cleanup:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Anything still open past the first sweep is bug-labeled or exempt; this gives bugs a longer runway.
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-stale: 60
          days-before-close: 30
          any-of-labels: bug
          stale-label: stale
          stale-issue-message: "This bug report has been inactive for 60 days and will be closed in 30 days."
