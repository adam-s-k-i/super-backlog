name: Publish

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Verify tag matches version and CHANGELOG
        run: |
          git fetch --tags origin
          TAG="v$(node -p "require('./package.json').version")"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          node scripts/verify-release.mjs "$TAG"
      - run: npm pack --dry-run --json | node scripts/check-pack-list.mjs
      - name: Publish to npm (OIDC provenance)
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/extract-changelog.mjs body.md
          gh release create "$TAG" --notes-file body.md --title "$TAG" --verify-tag
