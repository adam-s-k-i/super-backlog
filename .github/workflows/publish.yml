name: Publish

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Verify tag matches version and CHANGELOG
        run: |
          git fetch --tags origin
          TAG="v$(node -p "require('./package.json').version")"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          node scripts/verify-release.mjs "$TAG"
      - run: npm pack --dry-run --json | node scripts/check-pack-list.mjs
      - name: Publish to npm (OIDC provenance)
        run: |
          npm install -g npm@latest
          if npm view super-backlog@"${TAG#v}" version > /dev/null 2>&1; then
            echo "Version ${TAG#v} already published to npm; skipping publish"
          else
            npm publish --provenance --access public
          fi
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/extract-changelog.mjs body.md
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --notes-file body.md --title "$TAG" --verify-tag
